name: Publish control plane

on:
  push:
    branches: [main]
    paths:
      - apps/control-plane/**
      - packages/domain/**
      - package.json
      - package-lock.json
      - .github/workflows/publish-control-plane.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: ventneuf-prod-os-control-plane

concurrency:
  group: publish-control-plane
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_CONTROL_PLANE_IMAGE_PUBLISHER_ROLE_ARN }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - uses: docker/setup-buildx-action@v4.3.0

      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: apps/control-plane/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
